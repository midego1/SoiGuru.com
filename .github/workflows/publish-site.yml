name: Publish soiguru.com

# Rebuilds the static site and deploys the Worker whenever the content changes (spec 062).
# The owner app commits owner edits and photos to the `data` branch; a few minutes later
# they are live on soiguru.com. Code changes on `develop` are deployed by Cloudflare
# Workers Builds as before; this workflow only covers content.
#
# Secrets (repository settings → Secrets and variables → Actions):
# - CLOUDFLARE_API_TOKEN: a token with "Workers Scripts: Edit" on the account.
# - CLOUDFLARE_ACCOUNT_ID: the Cloudflare account id (Workers & Pages overview, right column).

on:
    push:
        branches:
            - data
    workflow_dispatch:

permissions:
    contents: read

# A burst of owner edits ends in one deploy: a newer run cancels the one still building.
concurrency:
    group: publish-site
    cancel-in-progress: true

jobs:
    publish:
        name: Build and deploy
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: astro
        env:
            # The site code is always the latest `develop`; the content is the push that triggered us.
            DATA_REPOSITORY: https://github.com/${{ github.repository }}
            DATA_REPOSITORY_BRANCH: data
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Checkout site code (develop)
              uses: actions/checkout@v7
              with:
                  ref: develop

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  package_json_file: astro/package.json

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: pnpm
                  cache-dependency-path: astro/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Straight to the app (not through turbo, which strips env vars it does not know):
            # clone the content, then a pure static build into apps/web/dist, the Worker's assets.
            - name: Clone content (data branch)
              run: pnpm exec tsx scripts/clone-content.ts
              working-directory: astro/apps/web

            - name: Build site
              run: pnpm exec astro build
              working-directory: astro/apps/web
              env:
                  ENABLE_ISR: 'false'
                  SITE_URL: https://soiguru.com

            - name: Deploy Worker
              run: npx wrangler@4 deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
